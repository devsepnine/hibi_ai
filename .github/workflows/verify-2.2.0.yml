name: Verify v2.2.0 candidate
on:
  push:
    branches: [verify/hibi-2.2.0]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux display and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev pkg-config \
            minisign xvfb xauth x11-utils python3-xlib python3-pil tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/installer
      - name: Check prose, architecture rules, formatting, and tests
        run: |
          python3 tools/lint-prose.py
          python3 tools/lint-arch.py
          python3 tools/test_skill_budget.py
          python3 tools/test_skill_checks.py
          cargo fmt --manifest-path tools/installer/Cargo.toml --check
          cargo test --locked --manifest-path tools/installer/Cargo.toml
          cargo test --locked --manifest-path tools/installer/Cargo.toml --no-default-features
          cargo test --locked --manifest-path tools/statusline/Cargo.toml
          python3 tools/installer/tests/install_smoke.py

      - name: Exercise signed update and rollback with two native builds
        run: xvfb-run -a python3 tools/installer/tests/update_smoke.py
      - name: Exercise desktop GUI with isolated configuration
        run: |
          cargo build --locked --manifest-path tools/installer/Cargo.toml
          python3 tools/installer/tests/cli_smoke.py --binary tools/installer/target/debug/hibi --artifacts /tmp/hibi-cli-smoke
          xvfb-run -a -s "-screen 0 1280x900x24" \
            python3 tools/installer/tests/gui_smoke.py \
            --binary tools/installer/target/debug/hibi --artifacts /tmp/hibi-gui-smoke
      - name: Upload GUI acceptance screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-acceptance
          path: /tmp/hibi-gui-smoke
          if-no-files-found: ignore
