name: Verify desktop launch compatibility
on:
  push:
    branches: [verify/desktop-launch-compat-20261127]
permissions:
  contents: read
  actions: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: build
          run-id: 46004434520
          github-token: ${{ github.token }}
      - name: CLI redirection
        run: python -u tools/installer/tests/compat/windows.py build/hibi.exe driver cli
      - name: Terminal GUI launch
        if: always()
        run: python -u tools/installer/tests/compat/windows.py build/hibi.exe driver terminal
        timeout-minutes: 2
      - name: Desktop GUI launch
        if: always()
        run: |
          Get-Process hibi -ErrorAction SilentlyContinue | Stop-Process -Force
          python -u tools/installer/tests/compat/windows.py build/hibi.exe driver desktop
        timeout-minutes: 2
      - name: Terminal interface
        if: always()
        run: |
          Get-Process hibi -ErrorAction SilentlyContinue | Stop-Process -Force
          python -u tools/installer/tests/compat/windows.py build/hibi.exe driver tui
        timeout-minutes: 2
