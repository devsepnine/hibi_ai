servers:
  - name: context7
    description: "라이브러리 버전별 문서 조회. Claude에서는 context7 플러그인과 택일"
    type: http
    url: "https://mcp.context7.com/mcp"
    setup:
      kind: bearer
      variable: CONTEXT7_API_KEY
      if_set: true
    category: docs

  - name: sequential-thinking
    description: "사고 단계를 도구 호출로 기록하는 작업용"
    command: "npx -y @modelcontextprotocol/server-sequential-thinking"
    category: reasoning

  - name: memory
    description: "세션 간 지식 그래프. 보관할 JSONL 파일의 절대 경로 지정"
    command: "npx -y @modelcontextprotocol/server-memory"
    setup:
      kind: file_env
      variable: MEMORY_FILE_PATH
    category: reasoning

  - name: next-devtools
    description: "Next.js 16 이상에서 실행 중인 개발 서버 진단"
    command: "npx -y next-devtools-mcp@latest"
    category: framework

  - name: sveltejs
    description: "Svelte와 SvelteKit 프로젝트의 문서 조회 및 코드 검사"
    command: "npx -y @sveltejs/mcp"
    category: framework

  - name: shadcn-ui
    description: "shadcn/ui 프로젝트의 레지스트리와 컴포넌트 조회"
    command: "npx -y shadcn@latest mcp"
    category: ui

  - name: playwright
    description: "브라우저 상태를 유지하며 화면 탐색. Claude에서는 playwright 플러그인과 택일"
    command: "npx -y @playwright/mcp@latest"
    category: automation

  - name: atlassian-remote
    description: "Jira와 Confluence Cloud OAuth 연결. Claude에서는 atlassian 플러그인과 택일"
    type: http
    url: "https://mcp.atlassian.com/v2/mcp"
    category: productivity

  - name: sentry
    description: "Sentry 장애 이벤트 조사. Claude에서는 sentry 플러그인과 택일"
    type: http
    url: "https://mcp.sentry.dev/mcp"
    category: productivity

  - name: clickhouse
    description: "ClickHouse Cloud 서비스에서 MCP를 활성화한 뒤 분석 데이터 조회"
    type: http
    url: "https://mcp.clickhouse.cloud/mcp"
    category: database
