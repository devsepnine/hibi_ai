[package]
name = "hibi_ai"
version = "2.4.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "hibi"
path = "src/main.rs"

[features]
default = ["gui"]
gui = [
    "dep:base64",
    "dep:dunce",
    "dep:flate2",
    "dep:iced",
    "dep:libc",
    "dep:minisign-verify",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:reqwest",
    "dep:semver",
    "dep:sys-locale",
    "dep:tar",
    "dep:winresource",
    "dep:zip",
]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
minisign-verify = { version = "0.2", optional = true }
semver = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
sys-locale = { version = "0.3", optional = true }
iced = { version = "0.14", optional = true, default-features = false, features = ["advanced", "tokio", "tiny-skia", "crisp", "svg", "linux-theme-detection", "x11", "wayland"] }
# TUI
ratatui = "0.30"
crossterm = "0.29"
terminal-light = "1.4"

# Filesystem
walkdir = "2.5"
dirs = "6.0"
tempfile = "3"

# Diff
similar = { version = "3.1", features = ["text"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_bw = "2.5"

# Content hashes in the install record
sha2 = "0.10"

# Command parsing
shlex = "2"

# Canonical Unicode search matching
unicode-normalization = "0.1"

# Error handling
anyhow = "1.0"

# Subprocess lifecycle
wait-timeout = "0.2"
command-group = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }
base64 = { version = "0.22", optional = true }
dunce = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
xattr = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", optional = true, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.2.2", optional = true, features = ["NSData", "NSThread"] }

[build-dependencies]
winresource = { version = "0.1.31", optional = true, default-features = false }

[profile.dev]
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
strip = true
