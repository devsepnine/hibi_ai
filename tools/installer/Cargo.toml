[package]
name = "hibi_ai"
version = "1.25.0"
edition = "2024"
rust-version = "1.89"

[[bin]]
name = "hibi"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:iced"]

[dependencies]
iced = { version = "0.14", optional = true, default-features = false, features = ["advanced", "tokio", "tiny-skia", "crisp", "svg", "x11", "wayland"] }
# TUI
ratatui = "0.30"
crossterm = "0.29"
terminal-light = "1.4"

# Filesystem
walkdir = "2.5"
dirs = "6.0"

# Diff
similar = { version = "3.1", features = ["text"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_bw = "2.5"

# Content hashes in the install record
sha2 = "0.10"

# Command parsing
shlex = "2"

# Canonical Unicode search matching
unicode-normalization = "0.1"

# Error handling
anyhow = "1.0"

# Timeout
wait-timeout = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
